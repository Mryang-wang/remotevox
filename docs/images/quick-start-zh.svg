<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866"
  role="img" aria-labelledby="title description" xml:lang="zh-Hans">
  <title id="title">T1 遥控器快速上手</title>
  <desc id="description">通过蓝牙连接 Mac，用遥控器听写、导航和执行快捷键。</desc>
  <style>
    text {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
    .brand {font-size:17px;font-weight:700;letter-spacing:1.7px;fill:#0b6178}
    .title {font-size:48px;font-weight:750;fill:#172b38}
    .summary {font-size:22px;fill:#465f70}
    .heading {font-size:24px;font-weight:700;fill:#172b38}
    .body {font-size:19px;fill:#385263}
    .number {font-size:17px;font-weight:700;fill:#fff;text-anchor:middle}
    .small {font-size:16px;font-weight:600;fill:#536b79}
  </style>
  <rect width="1240" height="866" rx="30" fill="#edf4f7"/>
  <rect x="52" y="40" width="174" height="33" rx="16.5" fill="#d8edf3"/>
  <text x="67" y="62" class="brand">T1 CONTROLLER</text>
  <rect x="51" y="198" width="350" height="595" rx="24" fill="#e1edf2"/>
