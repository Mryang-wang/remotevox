  <text x="51" y="128" class="title" >T1 遥控器快速上手</text>
  <text x="53" y="165" class="summary" >通过蓝牙连接 Mac，用遥控器听写、导航和执行快捷键。</text>
  <text x="226" y="775" class="small" text-anchor="middle">T1 正面 · 按键示意</text>
  <text x="459" y="830" class="small" >默认映射。可在「按键映射」中为不同 App 设置专用动作。</text>
  <path d="M272 419H348" stroke="#4793a7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="348" cy="419" r="16" fill="#0b6780"/>
  <text x="348" y="425" class="number" >1</text>
  <path d="M136 550H77" stroke="#4793a7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="77" cy="550" r="16" fill="#0b6780"/>
  <text x="77" y="556" class="number" >2</text>
  <path d="M271 323H348" stroke="#4793a7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="348" cy="323" r="16" fill="#0b6780"/>
  <text x="348" y="329" class="number" >3</text>
  <path d="M272 553H348" stroke="#4793a7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="348" cy="553" r="16" fill="#0b6780"/>
  <text x="348" y="559" class="number" >4</text>
  <path d="M272 487H348" stroke="#4793a7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="348" cy="487" r="16" fill="#0b6780"/>
  <text x="348" y="493" class="number" >5</text>
  <rect x="438" y="198" width="749" height="109" rx="18" fill="#fff" stroke="#d2e2ea"/>
  <circle cx="470" cy="228" r="16" fill="#0b6780"/>
  <text x="470" y="234" class="number" >1</text>
  <text x="497" y="234" class="heading" >语音键</text>
  <text x="497" y="262" class="body" >轻按一次开始听写，再轻按一次写入文字。</text>
  <text x="497" y="287" class="body" >Codex 录音中快速双击，可作废本次听写。</text>
  <rect x="438" y="319" width="749" height="109" rx="18" fill="#fff" stroke="#d2e2ea"/>
  <circle cx="470" cy="349" r="16" fill="#0b6780"/>
  <text x="470" y="355" class="number" >2</text>
  <text x="497" y="355" class="heading" >飞鼠开关</text>
  <text x="497" y="383" class="body" >按左侧长条键下半部切换飞鼠。</text>
  <text x="497" y="408" class="body" >飞鼠开启时，按住 OK 并移动遥控器即可拖选。</text>
  <rect x="438" y="440" width="749" height="109" rx="18" fill="#fff" stroke="#d2e2ea"/>
  <circle cx="470" cy="470" r="16" fill="#0b6780"/>
  <text x="470" y="476" class="number" >3</text>
  <text x="497" y="476" class="heading" >方向键与 OK</text>
  <text x="497" y="504" class="body" >方向键和键盘模式的 OK 支持自定义。</text>
  <text x="497" y="529" class="body" >关闭飞鼠后，再测试 OK 的键盘映射。</text>
  <rect x="438" y="561" width="749" height="109" rx="18" fill="#fff" stroke="#d2e2ea"/>
  <circle cx="470" cy="591" r="16" fill="#0b6780"/>
  <text x="470" y="597" class="number" >4</text>
  <text x="497" y="597" class="heading" >三横线</text>
  <text x="497" y="625" class="body" >单击打开系统 App 菜单。</text>
  <text x="497" y="650" class="body" >双击复制，长按粘贴。</text>
  <rect x="438" y="682" width="749" height="109" rx="18" fill="#fff" stroke="#d2e2ea"/>
  <circle cx="470" cy="712" r="16" fill="#0b6780"/>
  <text x="470" y="718" class="number" >5</text>
  <text x="497" y="718" class="heading" >主页键</text>
  <text x="497" y="746" class="body" >单击显示桌面，双击打开 App 切换器。</text>
  <text x="497" y="771" class="body" >长按新建 Codex 对话。</text>
  </svg>
