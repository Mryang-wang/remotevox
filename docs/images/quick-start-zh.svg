  <text x="205" y="329" text-anchor="middle" font-size="16" font-weight="700" fill="#f2f9fc">OK</text>
  <path d="M200 280l5-6 5 6m-10 86 5 6 5-6m-48-48-6 5 6 5m86-10 6 5-6 5"
